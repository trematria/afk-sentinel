[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trelab-afk-sentinel"
version = "0.1.0a0"
description = "Local-first GNOME lock-aware webcam motion monitor (developer alpha)"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "TRELAB contributors"}]
readme = "README.md"
keywords = ["security", "gnome", "linux", "motion", "camera"]
classifiers = ["Development Status :: 3 - Alpha", "Environment :: Console", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]

[project.scripts]
afk-sentinel = "afk_sentinel.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
